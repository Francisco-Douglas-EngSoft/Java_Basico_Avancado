<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java com HTML e CSS</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="cartao">
        <h1>Java com HTML e CSS</h1>
        <p>Digite seu nome. O formulário será enviado ao Java, que responderá nesta página.</p>

        <form action="/saudacao" method="post">
            <label for="nome">Seu nome</label>
            <input id="nome" name="nome" type="text" required>
            <button type="submit">Enviar para o Java</button>
        </form>

        <p class="explicacao">
            HTML cria o formulário, CSS cuida da aparência e Java recebe os dados e monta a resposta.
        </p>
    </main>
</body>
</html>
